<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
try {
  const s = localStorage.getItem('cc-v4-proto-scheme');
  if (s === 'light' || s === 'dark') {
    document.querySelector('meta[name="color-scheme"]').content = s;
  }
} catch {}
</script>
<title>ConduitCraft 4.0 — Interactive Transit Map Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
/* ========== 1. MODERN THEME & V4 TWO-TIER TOKENS ========== */
:root {
  color-scheme: light dark;
  --cc-font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cc-font-map: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --cc-font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --cc-spring: linear(0, .36 9%, .89 22%, 1.08 32%, 1.02 46%, .99 60%, 1);
  --cc-ease-out: cubic-bezier(.2, .8, .2, 1);
  --cc-fast: 120ms;
  --cc-base: 200ms;
  --cc-slow: 340ms;

  /* Surface & chrome tokens via light-dark() */
  --cc-canvas: light-dark(#ECEEF1, #0E1013);
  --cc-canvas-run: light-dark(#E2E5E9, #08090B);
  --cc-band-a: light-dark(#FFFFFF, #16181C);
  --cc-band-b: light-dark(#F6F7F9, #121417);
  --cc-plate: light-dark(#FFFFFF, #1C1F24);
  --cc-plate-edge: light-dark(#16181D, #DDE0E5);
  --cc-ink: light-dark(#16181D, #F1F2F4);
  --cc-ink-2: light-dark(#4F5560, #B6BBC2);
  --cc-ink-3: light-dark(#5C626A, #8E949D);
  --cc-on-ink: light-dark(#FFFFFF, #16181D);
  --cc-hair: light-dark(rgba(22, 24, 29, .10), rgba(255, 255, 255, .10));
  --cc-hair-2: light-dark(rgba(22, 24, 29, .18), rgba(255, 255, 255, .20));
  --cc-well: light-dark(rgba(22, 24, 29, .06), rgba(255, 255, 255, .07));
  --cc-well-2: light-dark(rgba(22, 24, 29, .13), rgba(255, 255, 255, .15));
  --cc-island: light-dark(rgba(255, 255, 255, .90), rgba(30, 33, 38, .90));
  --cc-solid: light-dark(#FFFFFF, #1E2126);

  /* Inverted focal dock */
  --cc-dock: light-dark(#16181D, #F1F2F4);
  --cc-on-dock: light-dark(#FFFFFF, #16181D);
  --cc-on-dock-2: light-dark(rgba(255, 255, 255, .72), rgba(22, 24, 29, .70));
  --cc-dock-well: light-dark(rgba(255, 255, 255, .14), rgba(22, 24, 29, .09));
  --cc-dock-hair: light-dark(rgba(255, 255, 255, .22), rgba(22, 24, 29, .18));
  --cc-fail-on-dock: light-dark(#FF8FA3, #BE123C);

  --cc-redline: light-dark(#C42316, #FF6B5E);
  --cc-on-bullet: light-dark(#FFFFFF, #0E1013);

  /* Two-tier palette: text tones (4.5:1) & line tones (3:1+) */
  --cc-text-blue: light-dark(#1D4ED8, #60A5FA);
  --cc-text-emerald: light-dark(#047857, #34D399);
  --cc-text-rose: light-dark(#BE123C, #FB7185);
  --cc-text-violet: light-dark(#5B21B6, #A78BFA);
  --cc-text-amber: light-dark(#B45309, #FBBF24);
  --cc-text-cyan: light-dark(#0B7C9E, #22D3EE);
  --cc-text-fuchsia: light-dark(#B5179E, #F0ABFC);

  --cc-line-blue: light-dark(#2563EB, #60A5FA);
  --cc-line-emerald: light-dark(#059669, #34D399);
  --cc-line-rose: light-dark(#E11D48, #FB7185);
  --cc-line-violet: light-dark(#7C3AED, #A78BFA);
  --cc-line-amber: light-dark(#C96A04, #FBBF24);
  --cc-line-cyan: light-dark(#0891B2, #22D3EE);
  --cc-line-fuchsia: light-dark(#C026D3, #F0ABFC);

  --cc-lift: light-dark(
    0 1px 1px rgba(22, 24, 29, .05), 0 10px 30px -12px rgba(22, 24, 29, .24),
    0 1px 1px rgba(0, 0, 0, .4), 0 12px 32px -12px rgba(0, 0, 0, .7)
  );
  --cc-lift-2: light-dark(
    0 2px 4px rgba(22, 24, 29, .06), 0 28px 60px -20px rgba(22, 24, 29, .38),
    0 2px 4px rgba(0, 0, 0, .4), 0 28px 60px -20px rgba(0, 0, 0, .85)
  );
  --cc-dock-shadow: light-dark(
    0 2px 3px rgba(22, 24, 29, .2), 0 18px 40px -14px rgba(22, 24, 29, .48),
    0 2px 3px rgba(0, 0, 0, .4), 0 18px 40px -14px rgba(0, 0, 0, .82)
  );

  --t: var(--cc-text-blue);
  --tl: var(--cc-line-blue);

  &:has(> head > meta[name="color-scheme"][content="dark"]) {
    color-scheme: dark;
  }
  &:has(> head > meta[name="color-scheme"][content="light"]) {
    color-scheme: light;
  }
}

[data-tone="blue"] { --t: var(--cc-text-blue); --tl: var(--cc-line-blue); }
[data-tone="emerald"] { --t: var(--cc-text-emerald); --tl: var(--cc-line-emerald); }
[data-tone="rose"] { --t: var(--cc-text-rose); --tl: var(--cc-line-rose); }
[data-tone="violet"] { --t: var(--cc-text-violet); --tl: var(--cc-line-violet); }
[data-tone="amber"] { --t: var(--cc-text-amber); --tl: var(--cc-line-amber); }
[data-tone="cyan"] { --t: var(--cc-text-cyan); --tl: var(--cc-line-cyan); }
[data-tone="fuchsia"] { --t: var(--cc-text-fuchsia); --tl: var(--cc-line-fuchsia); }

/* ========== 2. BASE ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body {
  font: 13px/20px var(--cc-font-ui);
  color: var(--cc-ink);
  background: var(--cc-canvas);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cc-ink); outline-offset: 2px; }
svg.ic {
  width: 18px; height: 18px;
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; flex: none;
}
kbd {
  font: 500 11px/1 var(--cc-font-mono);
  padding: 3px 6px; border-radius: 5px;
  background: var(--cc-well); color: var(--cc-ink-2);
}
.visually-hidden {
  position: absolute; clip-path: inset(50%); overflow: hidden;
  width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; white-space: nowrap;
}

/* Theme button branching driven directly by color-scheme state */
#themeBtn .th-dark-only { display: none; }
#themeBtn .th-light-only { display: inline-flex; align-items: center; }
@media (prefers-color-scheme: dark) {
  :root:not(:has(> head > meta[name="color-scheme"][content="light"])) #themeBtn .th-dark-only { display: inline-flex; align-items: center; }
  :root:not(:has(> head > meta[name="color-scheme"][content="light"])) #themeBtn .th-light-only { display: none; }
}
:root:has(> head > meta[name="color-scheme"][content="dark"]) #themeBtn .th-dark-only { display: inline-flex; align-items: center; }
:root:has(> head > meta[name="color-scheme"][content="dark"]) #themeBtn .th-light-only { display: none; }

/* ========== 3. SHEET & TRANSIT MAP ========== */
#sheet {
  position: fixed; inset: 0; overflow: hidden;
  background: var(--cc-canvas);
  touch-action: none;
  transition: background var(--cc-slow) var(--cc-ease-out);
}
:root[data-lens="traffic"] #sheet { background: var(--cc-canvas-run); }
#sheet.is-panning { cursor: grabbing; }
#sheet.is-armed .node { cursor: crosshair; }

#world {
  position: absolute; left: 0; top: 0;
  transform-origin: 0 0;
  --k: 1; --s: 1;
}
#diagram {
  position: absolute; left: 0; top: 0;
  transition: filter var(--cc-slow), opacity var(--cc-slow);
}
:root[data-lens="review"]:not([data-clear]):not([data-compare]) #diagram {
  filter: grayscale(1);
  opacity: .6;
}
#zones, #nodes { position: absolute; left: 0; top: 0; }
#wires, #redline, #labels, #geigerLayer {
  position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none;
}

/* Bands & Accordion Fold */
.zone {
  position: absolute; border-radius: 28px;
  background: var(--cc-band-a);
  transition: background var(--cc-slow), width var(--cc-base) var(--cc-ease-out), left var(--cc-base) var(--cc-ease-out);
}
.zone:nth-child(even) { background: var(--cc-band-b); }
.zone-head {
  position: absolute; left: 22px; top: 18px; right: 16px;
  display: flex; align-items: center; gap: calc(8px * var(--k));
  white-space: nowrap;
  font-family: var(--cc-font-map);
  font-size: calc(17px * var(--k));
  line-height: 1.1;
}
.zone-num { font-weight: 300; color: var(--cc-ink-3); font-variant-numeric: tabular-nums; }
.zone-title { font-weight: 700; font-stretch: 84%; letter-spacing: -.01em; }
.zone-fold {
  margin-left: auto;
  width: calc(24px * var(--k)); height: calc(24px * var(--k));
  border-radius: 7px;
  display: grid; place-items: center;
  color: var(--cc-ink-3);
  opacity: .68;
  transition: opacity var(--cc-fast), background var(--cc-fast), color var(--cc-fast);
}
.zone:hover .zone-fold, .zone-fold:focus-visible, .zone.is-folded .zone-fold {
  opacity: 1;
}
.zone-fold:hover { background: var(--cc-well); color: var(--cc-ink); }
.zone.is-folded {
  cursor: pointer;
  border: 1px dashed var(--cc-hair-2);
}
.zone.is-folded .zone-head {
  left: 50%; top: 24px; right: auto;
  transform: translateX(-50%);
  flex-direction: column; align-items: center; gap: calc(10px * var(--k));
}
.zone.is-folded .zone-title {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-size: calc(15px * var(--k));
}
.zone-pillar-meta {
  display: none;
  margin-top: calc(4px * var(--k));
  padding: calc(3px * var(--k)) calc(7px * var(--k));
  border-radius: 999px;
  background: var(--cc-well);
  color: var(--cc-ink-2);
  font: 600 calc(11px * var(--k))/1.2 var(--cc-font-mono);
}
.zone.is-folded .zone-pillar-meta { display: inline-block; }

/* Transit lines */
.wire { cursor: pointer; transition: opacity var(--cc-base); }
.wire path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.wire .hit { stroke: transparent; stroke-width: 24; pointer-events: stroke; }
.wire .casing { stroke: var(--cc-band-a); }
.wire .sel { stroke: var(--cc-ink); opacity: 0; }
.wire.is-selected .sel { opacity: 1; }
.wire .splice-glow { stroke: var(--tl); opacity: 0; transition: opacity var(--cc-fast); }
.wire.is-splice-target .splice-glow { opacity: .45; }
.wire .tube { stroke: var(--tl); opacity: 0; transition: opacity var(--cc-slow); }
:root[data-lens="traffic"] .wire[data-live="1"] .tube { opacity: .15; }
.wire .line { stroke: var(--tl); transition: stroke var(--cc-base); }
.wire .arrow { fill: var(--tl); stroke: var(--tl); }
.wire .stop { fill: var(--cc-plate); stroke: var(--tl); }
.wire.is-dim { opacity: .14; }
.wire.is-on .tube { opacity: .32 !important; }
.wire[data-live="0"] .line { stroke: var(--cc-ink-3); opacity: .7; }
.wire[data-live="0"] .arrow { fill: var(--cc-ink-3); stroke: var(--cc-ink-3); opacity: .7; }
.wire[data-live="0"] .stop { stroke: var(--cc-ink-3); }

/* Key & Trace Lineage dimming */
#world[data-key] .wire { opacity: .13; }
#world[data-key="blue"] .wire[data-tone="blue"],
#world[data-key="emerald"] .wire[data-tone="emerald"],
#world[data-key="rose"] .wire[data-tone="rose"],
#world[data-key="violet"] .wire[data-tone="violet"],
#world[data-key="amber"] .wire[data-tone="amber"],
#world[data-key="cyan"] .wire[data-tone="cyan"],
#world[data-key="fuchsia"] .wire[data-tone="fuchsia"] { opacity: 1; }

#world[data-trace] .node:not(.is-traced) { opacity: .16; }
#world[data-trace] .wire:not(.is-traced) { opacity: .11; }
.node.is-trace-root .fill { stroke: var(--tl); stroke-width: calc(3px * var(--k)); }
.node.is-trace-upstream .bullet { box-shadow: 0 0 0 calc(3px * var(--k)) var(--cc-plate), 0 0 0 calc(5.5px * var(--k)) var(--cc-line-violet); }
.node.is-trace-downstream .bullet { box-shadow: 0 0 0 calc(3px * var(--k)) var(--cc-plate), 0 0 0 calc(5.5px * var(--k)) var(--cc-line-emerald); }

/* Labels layer above nodes */
.wlabel { opacity: 0; transition: opacity var(--cc-fast); }
.wlabel rect { fill: var(--cc-plate); stroke: var(--cc-hair-2); }
.wlabel text { font: 500 11px var(--cc-font-ui); fill: var(--cc-ink); }
.wlabel .proto { font-family: var(--cc-font-mono); fill: var(--t); font-weight: 500; }
:root[data-lens="design"] [data-lod="high"] .wlabel.fits,
.wlabel.is-on { opacity: 1; }
#world[data-trace] .wlabel.is-traced { opacity: 1; }

.bead { fill: var(--tl); }
.bead.core { fill: var(--cc-plate); }
#train circle.ring { fill: var(--cc-plate); stroke: var(--tl); }

/* ========== 4. COMPONENTS, PLATES, BULLETS & SHAPES ========== */
.node {
  position: absolute;
  --pl: 16px; --pr: 16px; --pt: 14px;
  cursor: grab; user-select: none; -webkit-user-select: none;
  transition: opacity var(--cc-base);
}
.node .plate { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.plate .fill {
  fill: var(--cc-plate);
  stroke: var(--cc-plate-edge);
  stroke-width: calc(1.5px * var(--k));
  stroke-linejoin: round;
  transition: stroke var(--cc-base), fill var(--cc-slow);
}
.plate .rim { fill: none; stroke: var(--cc-plate-edge); stroke-width: calc(1.5px * var(--k)); }
.plate .hatch { fill: url(#hatch); opacity: 0; transition: opacity var(--cc-slow); }
.node[data-external] .fill { stroke-dasharray: calc(7px * var(--k)) calc(5px * var(--k)); }
.node[data-shape="hex"] { --pl: 46px; --pr: 46px; }
.node[data-shape="pill"] { --pl: 26px; --pr: 26px; }
.node[data-shape="pipe"] { --pl: 22px; --pr: 38px; }
.node[data-shape="cyl"] { --pt: 40px; }
.node[data-shape="mux"] { --pt: 26px; --pr: 20px; }

.inner {
  position: absolute; inset: 0;
  padding: var(--pt) var(--pr) 12px var(--pl);
  display: flex; flex-direction: column;
}
.body { display: flex; align-items: center; gap: calc(9px * var(--k)); min-width: 0; }
.bullet {
  position: relative; flex: none;
  width: calc(30px * var(--k)); height: calc(30px * var(--k));
  border-radius: 50%;
  background: var(--tl); color: var(--cc-on-bullet);
  display: grid; place-items: center;
  transition: background var(--cc-base), transform var(--cc-slow) var(--cc-spring);
}
.bullet svg { width: 58%; height: 58%; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.bullet .g-x { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .node:hover .bullet { transform: scale(1.08); }
}
.lamp {
  position: absolute; right: -6%; top: -6%;
  width: 30%; height: 30%; border-radius: 50%;
  background: var(--cc-line-emerald);
  box-shadow: 0 0 0 calc(2px * var(--k)) var(--cc-plate);
  display: none;
}
:root[data-lens="traffic"] .lamp { display: block; }

.names { min-width: 0; display: flex; flex-direction: column; gap: calc(1px * var(--k)); }
.name {
  font-family: var(--cc-font-map);
  font-weight: 700; font-stretch: 80%;
  font-size: calc(17px * var(--k));
  line-height: 1.07; letter-spacing: -.012em;
  text-wrap: balance;
}
.kind { font-size: calc(11px * var(--k)); line-height: 1.25; color: var(--cc-ink-3); white-space: nowrap; }
.sub {
  margin-top: 9px; font-size: 12px; line-height: 16px; color: var(--cc-ink-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.foot {
  margin-top: auto; display: flex; justify-content: space-between; align-items: center;
  gap: 8px; font-size: calc(11px * var(--k)); line-height: 1.3; color: var(--cc-ink-2);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.inst { display: none; align-items: center; gap: calc(3px * var(--k)); }
:root[data-lens="traffic"] .inst { display: flex; }
.cell {
  width: calc(8px * var(--k)); height: calc(8px * var(--k));
  border-radius: calc(2.5px * var(--k));
  background: var(--cc-well-2);
  transition: background var(--cc-base);
}
.cell.on { background: var(--tl); }
.ringi { width: calc(13px * var(--k)); height: calc(13px * var(--k)); }
.ringi circle { fill: none; stroke-width: 4; }
.ringi .tr { stroke: var(--cc-well-2); }
.ringi .va { stroke: var(--tl); }

/* Level badge on plates that hold child levels */
.lvl-pill {
  position: absolute; left: 50%; bottom: calc(-11px * var(--k));
  transform: translateX(-50%);
  height: calc(20px * var(--k));
  padding: 0 calc(8px * var(--k));
  border-radius: 999px;
  background: var(--cc-solid);
  border: calc(1.2px * var(--k)) solid var(--cc-plate-edge);
  font: 600 calc(10.5px * var(--k))/1 var(--cc-font-mono);
  color: var(--cc-ink);
  display: inline-flex; align-items: center; gap: calc(4px * var(--k));
  box-shadow: var(--cc-lift);
  z-index: 2;
  transition: transform var(--cc-fast), background var(--cc-fast), color var(--cc-fast);
}
.lvl-pill:hover, .lvl-pill:focus-visible {
  background: var(--cc-ink); color: var(--cc-on-ink);
  transform: translateX(-50%) scale(1.06);
}

/* Map mode (data-lod="low") */
[data-lod="low"] .inner { justify-content: center; padding-top: 0; padding-bottom: 0; }
[data-lod="low"] .node[data-shape="cyl"] .inner { padding-top: 20px; }
[data-lod="low"] .node[data-shape="pill"] { --pl: 16px; --pr: 16px; }
[data-lod="low"] .sub, [data-lod="low"] .read, [data-lod="medium"] .read { display: none; }
[data-lod="low"] .kind { display: none; }
[data-lod="low"] .foot { margin-top: calc(7px * var(--k)); padding-left: calc(39px * var(--k)); }
[data-lod="low"] .node[data-state] .kind { display: none; }
:root[data-lens="traffic"] [data-lod="low"] .node[data-state] .kind { display: block; }
:root[data-lens="design"] [data-lod="low"] .foot,
:root[data-lens="review"] [data-lod="low"] .foot { display: none; }

/* Actor terminus */
.node[data-shape="figure"] .inner { align-items: center; justify-content: center; padding: 0; }
.node[data-shape="figure"] .body { flex-direction: column; text-align: center; gap: calc(7px * var(--k)); }
.node[data-shape="figure"] .names { align-items: center; }
.node[data-shape="figure"] .bullet {
  width: calc(48px * var(--k)); height: calc(48px * var(--k));
  box-shadow: 0 0 0 calc(1.5px * var(--k)) var(--cc-plate-edge), 0 0 0 calc(5px * var(--k)) var(--cc-plate);
}
.node[data-shape="figure"] .sub, .node[data-shape="figure"] .foot { display: none; }

/* Selected: heavier edge + 4 ink crop marks */
.node.is-selected .fill, .node.is-selected .rim { stroke-width: calc(3px * var(--k)); }
.node.is-selected::after {
  content: ""; position: absolute; inset: calc(-10px * var(--k)); pointer-events: none;
  --b: calc(2.5px * var(--k)); --l: calc(15px * var(--k));
  --g: linear-gradient(var(--cc-ink) 0 0);
  background:
    var(--g) 0 0 / var(--l) var(--b), var(--g) 0 0 / var(--b) var(--l),
    var(--g) 100% 0 / var(--l) var(--b), var(--g) 100% 0 / var(--b) var(--l),
    var(--g) 0 100% / var(--l) var(--b), var(--g) 0 100% / var(--b) var(--l),
    var(--g) 100% 100% / var(--l) var(--b), var(--g) 100% 100% / var(--b) var(--l);
  background-repeat: no-repeat;
}
.node.is-dragging { cursor: grabbing; z-index: 5; }
@media (prefers-reduced-motion: no-preference) {
  .node.drop { animation: drop var(--cc-slow) var(--cc-spring); }
  .node.pulse .bullet { animation: pulse 520ms var(--cc-ease-out); }
}
@keyframes drop { from { transform: scale(.9); opacity: 0; } }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tl) 60%, transparent); }
  100% { box-shadow: 0 0 0 calc(14px * var(--k)) transparent; }
}

/* Traffic States + Geiger Hover Preview */
:root[data-lens="traffic"] .node[data-state="failed"] .fill { stroke: var(--cc-line-rose); }
:root[data-lens="traffic"] .node[data-state="failed"] .hatch { opacity: 1; }
:root[data-lens="traffic"] .node[data-state="failed"] .bullet { background: var(--cc-line-rose); }
:root[data-lens="traffic"] .node[data-state="failed"] .bullet .g-k { display: none; }
:root[data-lens="traffic"] .node[data-state="failed"] .bullet .g-x { display: block; }
:root[data-lens="traffic"] .node[data-state="failed"] .lamp { display: none; }

.chain .st .bullet { width: 30px; height: 30px; z-index: 1; }
.chain .st + .st::before {
  content: ""; position: absolute; right: 50%; top: 13px; width: 100%; height: 4px; border-radius: 2px;
  background: var(--lc, var(--cc-ink-3));
}
.chain .st.async-in::before {
  background: repeating-linear-gradient(90deg, var(--lc) 0 8px, transparent 8px 13px);
}
.c-side {
  border-left: 1px solid var(--cc-hair); padding: 16px;
  display: flex; flex-direction: column; gap: 8px; background: var(--cc-band-b); min-width: 0;
}
.c-side h3 { font: 700 19px/1.1 var(--cc-font-map); font-stretch: 82%; letter-spacing: -.01em; }
.c-side p { color: var(--cc-ink-2); line-height: 18px; }
.pv { position: relative; height: 104px; border-radius: 14px; background: var(--cc-canvas); overflow: hidden; --k: 1; }
.pv .node { left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) scale(.62); cursor: default; }
.c-foot {
  display: flex; gap: 14px; flex-wrap: wrap;
  padding: 9px 18px; border-top: 1px solid var(--cc-hair); color: var(--cc-ink-3); font-size: 12px;
}
.c-foot span { display: inline-flex; align-items: center; gap: 6px; }

.ghost {
  position: fixed; z-index: 40; pointer-events: none;
  transform: translate(-50%, -50%); --k: 1;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .24));
}
.ghost .bullet { width: 38px; height: 38px; }
.ghost .splice-pill {
  background: var(--cc-dock); color: var(--cc-on-dock);
  padding: 4px 10px; border-radius: 999px; font: 600 11.5px/1.2 var(--cc-font-ui);
  white-space: nowrap;
}

/* ========== 9. PROPERTIES CARD ========== */
.card-head { display: flex; align-items: center; gap: 11px; --k: 1; }
.card-head .bullet { width: 36px; height: 36px; }
.card-head b { display: block; font: 700 18px/1.1 var(--cc-font-map); font-stretch: 82%; letter-spacing: -.01em; }
.card-head small { color: var(--cc-ink-3); font-size: 12px; }
.card-close { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--cc-ink-3); }
.card-close:hover { background: var(--cc-well); color: var(--cc-ink); }
.tabs { display: flex; background: var(--cc-well); border-radius: 11px; padding: 3px; margin: 14px 0 6px; }
.tabs button { flex: 1; height: 28px; border-radius: 8px; font-weight: 500; color: var(--cc-ink-2); }
.tabs button[aria-selected="true"] { background: var(--cc-solid); color: var(--cc-ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.field { display: block; padding: 9px 0 0; }
.field > span { display: block; font-size: 12px; color: var(--cc-ink-3); }
.field input[type=text], .field textarea {
  width: 100%; border: 0; border-bottom: 1px solid var(--cc-hair-2);
  background: none; outline: 0; font-size: 14px; padding: 4px 0;
}
.field input[type=text]:focus, .field textarea:focus { border-bottom: 2px solid var(--cc-ink); }
.dots { display: flex; gap: 6px; padding-top: 6px; }
.dots button {
  width: 26px; height: 26px; border-radius: 50%; background: var(--tl);
  box-shadow: inset 0 0 0 2px var(--cc-solid); border: 2px solid transparent;
  transition: transform var(--cc-base) var(--cc-spring);
}
.dots button:hover { transform: scale(1.12); }
.dots button[aria-checked="true"] { border-color: var(--cc-ink); }
.rowf { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; }
.stepper { display: inline-flex; align-items: center; background: var(--cc-well); border-radius: 9px; }
.stepper button { width: 30px; height: 30px; border-radius: 9px; font-size: 16px; }
.stepper button:hover { background: var(--cc-well-2); }
.stepper output { min-width: 28px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.switch {
  width: 38px; height: 22px; border-radius: 11px;
  background: var(--cc-well-2); position: relative; transition: background var(--cc-base);
}
.switch::after {
  content: ""; position: absolute; left: 2px; top: 2px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--cc-solid); box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  transition: transform var(--cc-base) var(--cc-spring);
}
.switch[aria-checked="true"] { background: var(--cc-ink); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.card-note { color: var(--cc-ink-3); font-size: 12px; line-height: 17px; padding-top: 12px; }

/* ========== 10. TOP-LAYER DIALOGS (SHARE POSTER & SEQUENCE VIEW) ========== */
dialog.v4-dialog {
  margin: auto; border: 0; background: transparent; max-width: 1060px; width: calc(100vw - 32px);
  color: var(--cc-ink); padding: 0; overflow: visible;
  opacity: 0;
  transition-property: opacity, transform, display, overlay;
  transition-duration: 0.28s;
  transition-timing-function: var(--cc-ease-out);
  transition-behavior: allow-discrete;
}
@media (prefers-reduced-motion: no-preference) {
  dialog.v4-dialog { transform: scale(0.95) translateY(8px); }
}
dialog.v4-dialog::backdrop {
  background-color: rgba(0, 0, 0, 0);
  backdrop-filter: blur(0px);
  transition-property: background-color, backdrop-filter, display, overlay;
  transition-duration: 0.28s;
  transition-timing-function: ease-out;
  transition-behavior: allow-discrete;
}
dialog.v4-dialog[open]:where(:not([data-closing])) {
  opacity: 1;
  @starting-style { opacity: 0; }
  @media (prefers-reduced-motion: no-preference) {
    transform: scale(1) translateY(0);
    @starting-style { transform: scale(0.95) translateY(8px); }
  }
}
dialog.v4-dialog[open]:where(:not([data-closing]))::backdrop {
  background-color: color-mix(in srgb, var(--cc-canvas) 68%, rgba(0, 0, 0, .35));
  backdrop-filter: blur(8px);
  @starting-style { background-color: rgba(0, 0, 0, 0); backdrop-filter: blur(0px); }
}
@media (prefers-reduced-motion: reduce) {
  dialog.v4-dialog, dialog.v4-dialog::backdrop { transition-duration: 0.1s; }
}

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const root = document.documentElement;
const P = new URLSearchParams(location.search);
const noMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ========== THEME MANAGEMENT (modern-web-guidance: dark-mode-toggle) ========== */
const SCHEME_KEY = 'cc-v4-proto-scheme';
const schemeMeta = $('meta[name="color-scheme"]');
function renderedScheme() {
  if (schemeMeta.content === 'dark' || schemeMeta.content === 'light') return schemeMeta.content;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleColorScheme() {
  const target = renderedScheme() === 'dark' ? 'light' : 'dark';
  const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  try {
    if (target === system) {
      localStorage.removeItem(SCHEME_KEY);
      schemeMeta.content = 'light dark';
    } else {
      localStorage.setItem(SCHEME_KEY, target);
      schemeMeta.content = target;
    }
  } catch {
    schemeMeta.content = target;
  }
  renderAll();
}
window.addEventListener('storage', ev => {
  if (ev.key === SCHEME_KEY) {
    schemeMeta.content = (ev.newValue === 'light' || ev.newValue === 'dark') ? ev.newValue : 'light dark';
    renderAll();
  }
});

/* ========== DIALOG HELPERS (light-dismiss + animate-to-from-top-layer) ========== */
let supportsDisplayTransition;
function canTransitionDisplay() {

function effectiveZonesLayout() {
  if (currentLevel) return zones.map(z => ({ ...z, effX: z.x, effW: z.w, folded: false }));
  let cursor = 40;
  return zones.map(z => {
    const folded = foldedZones.has(z.id);
    const effW = folded ? 68 : z.w;
    const out = { ...z, effX: cursor, effW, folded };
    cursor += effW + 20;
    return out;
  });
}
function effectiveDocWidth(ez) {
  if (!ez.length) return 1400;

function nodeAnchorBox(n, ez) {
  if (currentLevel) return { x: n.x, y: n.y, w: n.w, h: n.h, hidden: false };
  const z = ez.find(zz => zz.id === n.zId);
  if (!z) return { x: n.x, y: n.y, w: n.w, h: n.h, hidden: false };
  if (z.folded) {
    // Route wires smoothly to the folded pillar's edge at the node's vertical level
    return { x: z.effX + 8, y: n.y + n.h / 2 - 20, w: z.effW - 16, h: 40, hidden: true, pillarX: z.effX, pillarW: z.effW };

  return { x: n.x + dx, y: n.y, w: n.w, h: n.h, hidden: false };
}

  const w = n.w, h = n.h, sh = CAT[n.cat].shape;
  let d, rim = '';
  if (sh === 'figure') return '';
  if (sh === 'pill') d = rr(w, h, h / 2);
  else if (sh === 'hex') { const i = 44; d = `M${i},0H${w - i}L${w},${h / 2}L${w - i},${h}H${i}L0,${h / 2}Z`; }
  else if (sh === 'cyl') { const r = 17; d = `M0,${r}A${w / 2},${r} 0 0 1 ${w},${r}V${h - r}A${w / 2},${r} 0 0 1 0,${h - r}Z`; rim = `M0,${r}A${w / 2},${r} 0 0 0 ${w},${r}`; }
  else if (sh === 'pipe') { const r = 15; d = `M${r},0H${w - r}A${r},${h / 2} 0 0 1 ${w - r},${h}H${r}A${r},${h / 2} 0 0 1 ${r},0Z`; rim = `M${w - r},0A${r},${h / 2} 0 0 0 ${w - r},${h}`; }
  else if (sh === 'mux') { const i = Math.round(h * .17); d = `M0,0L${w},${i}V${h - i}L0,${h}Z`; }

/* ========== TRACE LINEAGE (DEPENDENCY CONE & A→B PATH) ========== */
function toggleTrace(nodeId) {
  if (!nodeId) { traceState = null; }

  else { traceState = { rootId: nodeId, targetId: null }; }

}
function updateTracePill() {
  const ts = computeTraceSets();
  if (!ts) { tracePill.hidden = true; return; }

  if (ts.mode === 'cone') {
    tracePill.innerHTML = `<span><strong>${esc(rootNode?.title || '')}</strong> · ↑ ${ts.up.size} upstream · ↓ ${ts.down.size} downstream · <i>Shift+click another to trace path</i></span><button type="button" class="btn" id="clearTraceBtn">Done</button>`;
  } else if (ts.path) {
    const hopMs = [...ts.pathEdges].reduce((sum, eid) => sum + (E(eid)?.ms || 12), 0);
    const asyncCount = [...ts.pathEdges].filter(eid => E(eid)?.async).length;
    tracePill.innerHTML = `<span><strong>${esc(N(ts.path[0])?.title || '')} → ${esc(N(ts.path[ts.path.length - 1])?.title || '')}</strong> · ${ts.pathEdges.size} hops · ~${hopMs} ms${asyncCount ? ` · ${asyncCount} async` : ''}</span><button type="button" class="btn" id="clearTraceBtn">Done</button>`;
  } else {

/* ========== EDITING, UNDO & DROP-ON-WIRE AUTO-SPLICE ========== */
function snap() {
  history.push(JSON.stringify({ nodes, edges, zones, H, currentLevel }));
  if (history.length > 40) history.shift();
}
function undo() {
  const s = history.pop(); if (!s) return;
  ({ nodes, edges, zones, H, currentLevel } = JSON.parse(s));
  sel = null; traceState = null;
  renderAll();
  say('Undone.');
}
function freeSpot(cat) {
  const [w, h] = SIZE[cat];
  let [x, y] = toWorld(innerWidth / 2, innerHeight / 2 - 40);
  x = Math.round((x - w / 2) / 10) * 10; y = Math.round((y - h / 2) / 10) * 10;
  for (let i = 0; i < 30 && nodes.some(n => x < n.x + n.w + 20 && x + w + 20 > n.x && y < n.y + n.h + 20 && y + h + 20 > n.y); i++) { y += 40; x += 10; }
  return [x, y];
}
function zoneAtX(wx) {
  const ez = effectiveZonesLayout();
  const hit = ez.find(z => !z.folded && wx >= z.effX && wx <= z.effX + z.effW);
  return hit ? { z: hit, worldXOffset: hit.effX - hit.x } : { z: ez[0], worldXOffset: 0 };
}
function addNode(cat, title, x, y, opts = {}) {
  const c = CAT[cat], [w, h] = SIZE[cat];
  if (x == null) [x, y] = freeSpot(cat);
  const { z, worldXOffset } = zoneAtX(x + w / 2);
  const n = {
    id: nextId(cat), cat, title: title || c.name, tech: opts.tech || '', sub: opts.sub || '',
    tone: opts.tone || c.tone, x: Math.round(x - worldXOffset), y: Math.round(y), w, h,
    zId: z?.id || zones[0]?.id,
  };
  if (cat === 'service') n.copies = opts.copies || 1;
  if (cat === 'cache') n.hit = opts.hit || 80;
  if (cat === 'limiter') { n.admit = 4; n.per = 5; }
  nodes.push(n);
  return n;
}
function place(cat, title, x, y, opts = {}) {
  snap();
  const n = addNode(cat, title, x, y, opts);
  if (n.y + n.h > H - 80) { H = n.y + n.h + 140; renderZones(); }
  renderAll();
  select('node', n.id);
  $(`.node[data-id="${n.id}"]`)?.classList.add('drop');
  say(`Added ${n.title}.`);
  return n;
}

/* Drop-on-Wire Auto-Splice geometry */
function distToSeg(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, wx = px - ax, wy = py - ay;
  const c1 = vx * wx + vy * wy;
  if (c1 <= 0) return Math.hypot(px - ax, py - ay);
  const c2 = vx * vx + vy * vy;
  if (c2 <= c1) return Math.hypot(px - bx, py - by);
  const b = c1 / c2;
  return Math.hypot(px - (ax + b * vx), py - (ay + b * vy));
}
function findWireAtWorld(wx, wy, maxDist = 28) {
  let best = null, bestD = maxDist;
  for (const [eid, pts] of cachedRoutePts) {
    for (let i = 0; i + 1 < pts.length; i++) {
      const d = distToSeg(wx, wy, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
      if (d < bestD) { bestD = d; best = E(eid); }
    }
  }
  return best;
}
function spliceOnWire(edge, cat, wx, wy) {
  snap();
  const [w, h] = SIZE[cat];
  const n = addNode(cat, null, wx - w / 2, wy - h / 2);
  const isQueue = cat === 'queue' || cat === 'stream';
  const idx = edges.findIndex(e => e.id === edge.id);
  const first = {
    id: nextId('e'), from: edge.from, to: n.id,
    tone: isQueue ? 'amber' : edge.tone, label: edge.label || 'Calls', proto: edge.proto,
    async: isQueue ? true : edge.async, ms: Math.max(4, Math.round((edge.ms || 12) / 2)),
  };
  const second = {
    id: nextId('e'), from: n.id, to: edge.to,
    tone: edge.tone, label: cat === 'cache' ? 'Miss: load' : (edge.label || 'Forward'), proto: edge.proto,
    async: edge.async, ms: Math.max(4, Math.round((edge.ms || 12) / 2)),
  };
  edges.splice(idx, 1, first, second);
  renderAll();
  select('node', n.id);
  $(`.node[data-id="${n.id}"]`)?.classList.add('drop');
  say(`Spliced ${n.title} into wire ${N(first.from)?.title} → ${N(second.to)?.title}. ⌘Z undoes it.`);
}

function removeSel() {

      sheet.setPointerCapture(ev.pointerId);

});

sheet.addEventListener('pointermove', ev => {
  if (drag) {
    const dx = (ev.clientX - drag.sx) / cam.s, dy = (ev.clientY - drag.sy) / cam.s, n = drag.n;
    if (!drag.moved) { if (Math.hypot(dx, dy) < 3) return; drag.moved = true; snap(); drag.el.classList.add('is-dragging'); }
    let x = Math.round((drag.ox + dx) / 5) * 5, y = Math.round((drag.oy + dy) / 5) * 5;
    for (const e of edges) {
      const o = e.from === n.id ? N(e.to) : e.to === n.id ? N(e.from) : null;
      if (!o) continue;
      const cy = o.y + o.h / 2 - n.h / 2, cx = o.x + o.w / 2 - n.w / 2;
      if (Math.abs(cy - y) < 12) y = cy;
      if (Math.abs(cx - x) < 12) x = cx;
    }
    n.x = x; n.y = y;
    const ez = effectiveZonesLayout();
    const box = nodeAnchorBox(n, ez);
    drag.el.style.left = box.x + 'px';
    drag.el.style.top = box.y + 'px';
    renderWires();
    updateCtxBar();
  } else if (pan) {
    const dx = ev.clientX - pan.sx, dy = ev.clientY - pan.sy;
    if (!pan.moved && Math.hypot(dx, dy) < 3) return;
    pan.moved = true; sheet.classList.add('is-panning');
    cam.x = pan.ox + dx; cam.y = pan.oy + dy; applyCam();
  }
});

sheet.addEventListener('pointerup', ev => {
  if (wireDraft) {
    const targetEl = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.node');
    const toId = targetEl?.dataset.id;
    if (toId && toId !== wireDraft.from) {
      snap();
      edges.push({ id: nextId('e'), from: wireDraft.from, to: toId, tone: N(toId)?.tone || 'blue', label: 'Calls', proto: 'http', ms: 12 });
      renderWires();
      say(`Wired ${N(wireDraft.from)?.title} → ${N(toId)?.title}.`);
    }
    wireDraft = null;
    return;
  }
  if (drag) { drag.el.classList.remove('is-dragging'); drag = null; }
  if (pan) { if (!pan.moved) select(null); pan = null; sheet.classList.remove('is-panning'); }
});

function buildBeads() {
  beads = []; beadsG.innerHTML = ''; trainG.innerHTML = '';
  if (lens !== 'traffic' || noMotion) return;
  const k = kOf(cam.s);
  for (const e of edges) {

      beadsG.append(g);

    }

let last = performance.now();

function computeFailureImpact(failSet) {
  const up = new Set(), q = nodes.filter(n => (n.cat === 'actor' || n.cat === 'scheduler') && !failSet.has(n.id)).map(n => n.id);
  q.forEach(i => up.add(i));
  while (q.length) {
    const a = q.shift();
    for (const e of edges) if (e.from === a && !failSet.has(e.to) && !up.has(e.to)) { up.add(e.to); q.push(e.to); }
  }
  const dist = {}, dq = [...failSet]; dq.forEach(i => dist[i] = 0);
  while (dq.length) {
    const a = dq.shift();
    for (const e of edges) if (e.from === a && dist[e.to] == null) { dist[e.to] = dist[a] + 1; dq.push(e.to); }
  }
  const unreach = new Set(), buf = new Set();
  for (const n of nodes) {
    if (!failSet.has(n.id) && failSet.size && !up.has(n.id)) unreach.add(n.id);
    else if (!failSet.has(n.id) && (n.cat === 'queue' || n.cat === 'stream') && edges.some(e => e.from === n.id && failSet.has(e.to))) buf.add(n.id);
  }
  return { unreach, buf, dist };
}

function runGeiger(nodeId) {
  const target = N(nodeId); if (!target || failed.has(nodeId)) return;
  if (geigerTargetId === nodeId) return;

  const hyp = new Set(failed);
  if ((target.copies || 1) <= 1) hyp.add(nodeId);
  const { unreach, buf } = computeFailureImpact(hyp);
  $$('.node', nodesEl).forEach(el => {
    const id = el.dataset.id;
    el.classList.toggle('geiger-hit', unreach.has(id) || id === nodeId);
    el.classList.toggle('geiger-buf', buf.has(id));

  geigerBadge.hidden = false;
  geigerBadge.style.left = `${box.x + box.w / 2}px`;
  geigerBadge.style.top = `${box.y}px`;
  if ((target.copies || 1) > 1) {
    geigerBadge.innerHTML = `<span class="is-safe">✓ 0 unreachable · ${target.copies} copies absorb failure</span>`;
  } else {
    geigerBadge.innerHTML = `<span class="is-danger">✕ ${unreach.size} unreachable${buf.size ? ` · ${buf.size} buffering` : ''}</span>`;
  }
}
function clearGeiger() {

function roughEllipse(cx, cy, rx, ry, seed) {
  let r = seed;
  const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const ph = rnd() * 6.28, a0 = -2.5 + rnd() * .5, n = 48, pts = [];
  for (let i = 0; i <= n + 6; i++) {
    const t = a0 + i / n * Math.PI * 2, w = 1 + .03 * Math.sin(t * 3 + ph) + (i > n ? (i - n) * .013 : 0);
    pts.push((cx + Math.cos(t) * rx * w).toFixed(1) + ',' + (cy + Math.sin(t) * ry * w * (1 + .025 * Math.cos(t * 2 + ph))).toFixed(1));
  }
  return 'M' + pts.join('L');
}
function enterReview() {

const capStr = s => s.charAt(0).toUpperCase() + s.slice(1);
function guess(raw) {
  const name = raw.trim().replace(/\s+/g, ' '), lower = name.toLowerCase(), words = lower.split(/[^a-z0-9]+/);
  for (const [id, c] of Object.entries(CAT)) if (lower === c.name.toLowerCase() || lower === id) return { cat: id, title: c.name };
  for (const [w, cat] of WORDS) if (words.includes(w)) return { cat, title: name === lower ? capStr(name) : name };
  return { cat: 'service', title: name === lower ? capStr(name) : name };
}
function parseChain(q) {
  const ns = [], es = [], seen = {};
  const get = raw => {
    const name = raw.trim().replace(/\s+/g, ' '); if (!name) return null;
    const key = name.toLowerCase(); if (seen[key]) return seen[key];
    const ex = nodes.find(n => n.title.toLowerCase() === key), m = guess(name);
    const o = ex ? { ex, title: ex.title, cat: ex.cat, tone: ex.tone } : { title: m.title, cat: m.cat, tone: CAT[m.cat].tone };
    seen[key] = o; ns.push(o); return o;
  };
  for (const chain of q.split(',')) {
    let prev = null, op = '>';
    for (const part of chain.split(/(~>|>)/)) {
      if (part === '>' || part === '~>') { op = part; continue; }
      const n = get(part); if (!n) continue;
      if (prev && prev !== n) es.push({ a: prev, b: n, async: op === '~>' });
      prev = n;
    }
  }
  return { ns, es };
}
function buildChain(plan) {
  const fresh = plan.ns.filter(o => !o.ex); if (!plan.ns.length) return;
  snap();
  const depth = new Map(plan.ns.map(o => [o, 0]));
  for (let i = 0; i < plan.ns.length; i++) {
    for (const l of plan.es) if (depth.get(l.b) < depth.get(l.a) + 1 && depth.get(l.a) < plan.ns.length) depth.set(l.b, depth.get(l.a) + 1);
  }
  const anchor = plan.ns.find(o => o.ex);
  const bottom = Math.max(200, ...nodes.map(n => n.y + n.h));
  const y0 = bottom + 90, x0 = anchor ? Math.max(80, anchor.ex.x) : Math.max(80, Math.round(toWorld(120, 0)[0] / 10) * 10);
  const rows = {};
  let x1 = x0, y1 = y0 + 172;
  for (const o of fresh) {
    const [w, h] = SIZE[o.cat], d = depth.get(o), r = rows[d] = (rows[d] ?? -1) + 1;
    o.ex = addNode(o.cat, o.title, x0 + d * 332 + (242 - w) / 2, y0 + r * 212 + (172 - h) / 2);
    x1 = Math.max(x1, o.ex.x + w); y1 = Math.max(y1, o.ex.y + h);
  }
  for (const l of plan.es) {
    edges.push({ id: nextId('e'), from: l.a.ex.id, to: l.b.ex.id, tone: l.b.tone, label: '', async: l.async, ms: 12 });
  }
  H = Math.max(H, y1 + 150);
  renderAll();
  fresh.forEach(o => $(`.node[data-id="${o.ex.id}"]`)?.classList.add('drop'));
  if (fresh.length) {
    const gw = Math.max(300, x1 - x0), gh = Math.max(200, y1 - y0);
    const s = Math.min(.9, (innerWidth - 200) / gw, (innerHeight - 260) / gh);
    select('node', fresh[0].ex.id);
    fly({ x: innerWidth / 2 - (x0 + gw / 2) * s, y: (innerHeight - 90) / 2 - (y0 + gh / 2) * s, s });
  }
  say(`Added ${fresh.length} ${fresh.length === 1 ? 'component' : 'components'} and ${plan.es.length} ${plan.es.length === 1 ? 'wire' : 'wires'}. ⌘Z undoes it.`);
}

function buildSequenceSvg() {
  const sc = run.sc;
  const lifelines = [];
  const seen = new Set();
  const messages = [];
  for (const [eid, label] of sc.steps) {
    const e = E(eid); if (!e) continue;
    if (!seen.has(e.from)) { seen.add(e.from); lifelines.push(N(e.from)); }
    if (!seen.has(e.to)) { seen.add(e.to); lifelines.push(N(e.to)); }
    messages.push({ e, label, from: N(e.from), to: N(e.to) });
  }
  const colW = 148, padX = 80, topY = 58, rowH = 38;
  const width = Math.max(680, padX * 2 + lifelines.length * colW);
  const height = topY + 60 + messages.length * rowH;
  const xOf = id => padX + lifelines.findIndex(n => n?.id === id) * colW + colW / 2;

  const heads = lifelines.map(n => {
    if (!n) return '';
    const x = xOf(n.id), isFail = failed.has(n.id);
    return `<g>
      <line x1="${x}" y1="${topY + 20}" x2="${x}" y2="${height - 20}" stroke="var(--cc-hair-2)" stroke-dasharray="4 4"/>
      <rect x="${x - 62}" y="12" width="124" height="36" rx="10" fill="var(--cc-plate)" stroke="${isFail ? 'var(--cc-line-rose)' : 'var(--cc-plate-edge)'}" stroke-width="1.6"/>
      <circle cx="${x - 44}" cy="30" r="8" fill="var(--cc-line-${isFail ? 'rose' : n.tone})"/>
      <text x="${x - 30}" y="34" font-size="11.5" font-weight="700" fill="var(--cc-ink)">${esc(n.title.slice(0, 14))}</text>
    </g>`;
  }).join('');

  const arrows = messages.map((m, i) => {
    const y = topY + 46 + i * rowH, x1 = xOf(m.e.from), x2 = xOf(m.e.to);
    const dir = x2 >= x1 ? 1 : -1, tipX = x2 - dir * 6;
    const isBroken = !edgeLive(m.e);
    const stroke = isBroken ? 'var(--cc-line-rose)' : `var(--cc-line-${m.e.tone})`;
    return `<g>
      <line x1="${x1}" y1="${y}" x2="${tipX}" y2="${y}" stroke="${stroke}" stroke-width="2.2" ${m.e.async ? 'stroke-dasharray="6 4"' : ''}/>
      <polygon points="${x2},${y} ${x2 - dir * 8},${y - 4.5} ${x2 - dir * 8},${y + 4.5}" fill="${stroke}"/>
      <text x="${(x1 + x2) / 2}" y="${y - 7}" text-anchor="middle" font-size="11" font-weight="600" fill="${isBroken ? 'var(--cc-text-rose)' : 'var(--cc-ink)'}">${i + 1}. ${esc(m.label)}${isBroken ? ' [BLOCKED]' : ''}</text>
    </g>`;
  }).join('');

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="font-family:var(--cc-font-ui)">${heads}${arrows}</svg>`;
}
function openSequenceDialog() {
  const svg = buildSequenceSvg();
  $('#seqDialogBody').innerHTML = `
    <div class="seq-head">
      <div><h2 id="seqTitle">Sequence: ${esc(run.sc.name)}</h2><p style="color:var(--cc-ink-2);font-size:12.5px">Derived automatically from the scenario path (${run.sc.steps.length} hops).</p></div>
      <button type="button" class="btn line" id="dlSeqBtn" style="margin-left:auto">Download SVG</button>
      <button type="button" class="btn primary" id="closeSeqBtn">Close</button>
    </div>
    <div class="seq-wrap">${svg}</div>`;
  seqDialog.showModal();
  $('#dlSeqBtn').onclick = () => downloadText('sequence-view.svg', buildSequenceSvg(), 'image/svg+xml');
  $('#closeSeqBtn').onclick = () => closeTopLayer(seqDialog);
}

/* ========== KEYBOARD SHORTCUTS ========== */
addEventListener('keydown', ev => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '');
  const mod = ev.metaKey || ev.ctrlKey, k = ev.key.toLowerCase();
  if (ev.key === 'Alt') { altDown = true; }
  if (mod && k === 'k') { ev.preventDefault(); return openComposer('', 'commands'); }
  if (mod && k === 'f') { ev.preventDefault(); return openComposer('', 'find'); }
  if (mod && ev.key === 'ArrowUp' && currentLevel) { ev.preventDefault(); return exitLevel(); }
  if (typing) return;
  if (mod && k === 'z') { ev.preventDefault(); return undo(); }
  if (mod) return;
  if (ev.key === 'Escape') {
    if (wipeCompare) return toggleWipeCompare(false);
    if (traceState) return toggleTrace(null);
    if (armed) return setArmed(false);
    return select(null);
  }
  if (k === '/' || (k === 'c' && lens === 'design')) { ev.preventDefault(); return openComposer('', 'all'); }
  if ((k === '1' && ev.shiftKey) || ev.key === '!') return fit(true);
  if (k === '1') return setLens('design');
  if (k === '2') return setLens('traffic');
  if (k === '3') return setLens('review');
  if (k === 'i' && sel?.type === 'node') return toggleTrace(sel.id);
  if (lens === 'design') {
    const t = { v: 'select', w: 'wire', h: 'hand' }[k];
    if (t) return setTool(t);
    if (ev.key === 'Delete' || ev.key === 'Backspace') return removeSel();
  }
  if (lens === 'traffic') {
    if (ev.key === ' ') { ev.preventDefault(); return run.playing ? pause() : play(); }
    if (ev.key === 'ArrowRight') return stepTo(run.i < 0 ? 0 : run.i + 1);
    if (ev.key === 'ArrowLeft') return stepTo(run.i - 1);
    if (k === 'x') { if (sel && sel.type === 'node') return toggleFail(sel.id); return setArmed(!armed); }
  }
  if (lens === 'review' && !wipeCompare) {
    if (ev.key === 'ArrowRight') return nextIssue(1);
    if (ev.key === 'ArrowLeft') return nextIssue(-1);
  }
  if (ev.key === '+' || ev.key === '=') return zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
  if (ev.key === '-') return zoomAt(innerWidth / 2, innerHeight / 2, .8);
});
addEventListener('keyup', ev => { if (ev.key === 'Alt') { altDown = false; if (!armed) clearGeiger(); } });
addEventListener('resize', moveThumb);

/* ========== INITIAL PAINT ========== */
function renderAll() {
  renderBreadcrumb();
  renderZones();
  renderNodes();
  renderWires();
  renderKey();
  updateDock();
  updateBoard();
  updateCard();
  updateCtxBar();
  updateTracePill();
  if (lens === 'review') enterReview();
}
function drawIn() {
  if (noMotion) return;
  $$('.wire', wg).forEach(g => {
    const e = E(g.dataset.id); if (!e) return;
    const delay = 140 + (N(e.from)?.x || 0) * .35;
    const line = $('.line', g);
    const opt = { duration: 480, delay, easing: 'cubic-bezier(.3,0,.2,1)', fill: 'backwards' };
    if (e.async) line.animate([{ opacity: 0 }, { opacity: 1 }], opt);
    else {
      const len = line.getTotalLength();
      line.style.strokeDasharray = len;
      line.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], opt).onfinish = () => { line.style.strokeDasharray = ''; };
    }
    $$('.arrow,.stop,.casing', g).forEach(x => x.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, delay: delay + (x.matches('.arrow') ? 440 : 0), fill: 'backwards' }));
  });
  $$('.node', nodesEl).forEach(el => {
    const n = N(el.dataset.id);
    el.animate([{ opacity: 0, transform: 'scale(.92)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 380, delay: (n?.x || 0) * .35, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
  });
}

root.dataset.lens = 'design';
renderAll();
fit(false);
updateHint();
drawIn();
(document.fonts?.ready || Promise.resolve()).then(moveThumb);
if (P.get('lens')) setLens(P.get('lens'), true);
if (P.get('select')) select('node', P.get('select'));
if (P.get('fail')) P.get('fail').split(',').forEach(toggleFail);
if (P.has('step')) stepTo(+P.get('step'));
if (P.has('composer')) openComposer(P.get('composer'));
if (P.has('share')) openShareDialog();
requestAnimationFrame(tick);
</script>
