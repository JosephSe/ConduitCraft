<!doctype html>
<html lang="en">
<head>

<!-- Concept mockup for the properties card (docs/v3/INSPECTOR_SPEC.md). Static, hand-written, not wired to the app.
     Fonts load from Google Fonts here only for convenience; the app ships them itself. -->
<title>ConduitCraft Properties Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
/* Layout: the sheet fills the window; the properties card is one floating island in slot E that hugs its content. */
:root {
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --blue: #1D4ED8; --emerald: #047857; --rose: #BE123C; --violet: #5B21B6; --amber: #B45309; --cyan: #0B7C9E; --fuchsia: #B5179E;
  --canvas: #ECEFEE; --dot: #8CC4D8;
  --sheet: #FFFFFF; --island: rgba(255,255,255,.84); --well: rgba(21,24,28,.055); --well-2: rgba(21,24,28,.1);
  --ink: #15181C; --ink-2: #565C64; --ink-3: #5C626A; --on-ink: #FFFFFF;
  --hair: rgba(21,24,28,.11); --hair-2: rgba(21,24,28,.2); --field-edge: #7A7F85;
  --redline: #C42316;
  --lift: 0 1px 1px rgba(21,24,28,.05), 0 10px 30px -10px rgba(21,24,28,.22);
  --contact: 0 1px 2px rgba(21,24,28,.07);
  --spring: linear(0, .36 9%, .89 22%, 1.08 32%, 1.02 46%, .99 60%, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --blue: #60A5FA; --emerald: #34D399; --rose: #FB7185; --violet: #A78BFA; --amber: #FBBF24; --cyan: #22D3EE; --fuchsia: #F0ABFC;
  --canvas: #1D1F21; --dot: rgba(140,196,216,.3);
  --sheet: #2A2C2F; --island: rgba(46,48,51,.84); --well: rgba(255,255,255,.07); --well-2: rgba(255,255,255,.13);
  --ink: #F2F3F1; --ink-2: #B7BBBF; --ink-3: #92979C; --on-ink: #1D1F21;
  --hair: rgba(255,255,255,.1); --hair-2: rgba(255,255,255,.2); --field-edge: #7F8184;
  --redline: #FF6B5E;
  --lift: 0 0 0 .5px rgba(0,0,0,.5), 0 14px 34px -12px rgba(0,0,0,.6);
  --contact: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --blue: #60A5FA; --emerald: #34D399; --rose: #FB7185; --violet: #A78BFA; --amber: #FBBF24; --cyan: #22D3EE; --fuchsia: #F0ABFC;
  --canvas: #1D1F21; --dot: rgba(140,196,216,.3);
  --sheet: #2A2C2F; --island: rgba(46,48,51,.84); --well: rgba(255,255,255,.07); --well-2: rgba(255,255,255,.13);
  --ink: #F2F3F1; --ink-2: #B7BBBF; --ink-3: #92979C; --on-ink: #1D1F21;
  --hair: rgba(255,255,255,.1); --hair-2: rgba(255,255,255,.2); --field-edge: #7F8184;
  --redline: #FF6B5E;
  --lift: 0 0 0 .5px rgba(0,0,0,.5), 0 14px 34px -12px rgba(0,0,0,.6);
  --contact: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; position: relative; overflow: hidden; font: 400 13px/20px var(--sans); color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; margin: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* ---- sheet and stand-in chrome ---- */
.sheet { position: absolute; inset: 0; background-image: radial-gradient(var(--dot) 1.1px, transparent 1.4px); background-size: 24px 24px; }
.island { position: absolute; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 14px; background: var(--island); border: 1px solid var(--hair); box-shadow: var(--lift); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); }
.nw { left: 16px; top: 16px; padding-right: 14px; gap: 10px; }
.nw .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; }
.nw b { font: 600 15px/19px var(--sans); }
.nw span { color: var(--ink-3); font-size: 12px; }
.ne { right: 16px; top: 16px; }
.se { right: 16px; bottom: 16px; }
.gh { height: 32px; min-width: 32px; padding: 0 10px; border-radius: 9px; font-weight: 500; display: inline-grid; place-items: center; color: var(--ink-2); }
.gh:hover { background: var(--well); color: var(--ink); }
.gh.solid { background: var(--ink); color: var(--on-ink); }
.zoom { min-width: 46px; text-align: center; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.hint { position: absolute; left: 0; right: 336px; bottom: 26px; text-align: center; color: var(--ink-3); pointer-events: none; padding: 0 16px; }

.stage { position: absolute; left: calc(50% - 168px); top: 50%; width: 590px; height: 290px; transform: translate(-50%, -50%); }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wire { stroke: var(--t); stroke-width: 1.75; fill: none; }
.wire.async { stroke-dasharray: 6 5; }
.whit { stroke: transparent; stroke-width: 18; cursor: pointer; fill: none; }
.whalo { stroke: var(--ink); stroke-width: 7; opacity: 0; stroke-linecap: round; fill: none; }
g.sel .whalo { opacity: .16; }
.node { position: absolute; display: grid; place-items: center; font-stretch: 88%; text-align: center; --t: var(--blue); border-radius: 12px; }
.node .plate { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(var(--contact)); }
.node .plate * { fill: color-mix(in oklab, var(--t) 6%, var(--sheet)); stroke: color-mix(in oklab, var(--t) 58%, var(--sheet)); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.node .nb { position: relative; display: grid; gap: 1px; padding: 0 16px; max-width: 100%; }
.node .nb b { font: 600 14px/17px var(--sans); font-stretch: 88%; }
.node .nb i { font-style: normal; font-size: 11px; line-height: 14px; color: var(--ink-2); }
.node.is-sel { outline: 1.5px solid var(--ink); outline-offset: 5px; }
.node.locked .nb b::after { content: " 🔒"; font-size: 10px; }

/* ---- the properties card ---- */
.insp { position: absolute; right: 16px; top: 72px; width: 304px; max-height: calc(100% - 72px - 84px); display: flex; flex-direction: column; border-radius: 16px; background: var(--island); border: 1px solid var(--hair); box-shadow: var(--lift); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); }
.insp.enter { animation: slide .3s var(--spring); }
@keyframes slide { from { opacity: 0; transform: translateX(14px); } }
.head { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 8px 10px 14px; position: relative; }
.art { width: 44px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in oklab, var(--t) 13%, var(--sheet)); border: 1px solid color-mix(in oklab, var(--t) 36%, var(--sheet)); }
.art svg { width: 28px; height: 18px; overflow: visible; }
.art svg * { fill: none; stroke: var(--t); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.who { min-width: 0; display: grid; }
.name { width: 100%; border: 0; background: none; padding: 1px 4px; margin-left: -4px; border-radius: 6px; font: 600 16px/20px var(--sans); text-overflow: ellipsis; }
.name:hover { background: var(--well); }
.name:focus { background: var(--well); outline: none; box-shadow: inset 0 0 0 1.5px var(--ink); }
.kind { position: relative; justify-self: start; display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 0 6px 0 4px; margin-left: -4px; border-radius: 5px; }
.kind:hover { background: var(--well); } .kind:hover .kindtxt { color: var(--ink); }
.kind:focus-within { outline: 2px solid var(--ink); outline-offset: 1px; }
.kind select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.kind::after { content: ""; width: 5px; height: 5px; margin-top: -3px; border: solid var(--ink-3); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); flex: none; }
.kindtxt { font-size: 12px; line-height: 18px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtns { display: flex; align-self: start; }
.ib { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.ib:hover, .ib[aria-expanded="true"] { background: var(--well); color: var(--ink); }
.menu { position: absolute; right: 8px; top: 44px; z-index: 5; min-width: 190px; padding: 4px; border-radius: 12px; background: var(--sheet); border: 1px solid var(--hair); box-shadow: var(--lift); display: grid; }
.menu button { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px; text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--well); outline: none; }
.menu button kbd { margin-left: auto; font: 400 11px var(--mono); color: var(--ink-3); }
.menu button.danger { color: var(--redline); }
.menu hr { border: 0; border-top: 1px solid var(--hair); margin: 4px 6px; }
.menu .ico { color: var(--ink-2); } .menu .danger .ico { color: inherit; }
.iconmenu { right: auto; left: 98px; top: auto; grid-template-columns: repeat(4, 34px); min-width: 0; }
.iconmenu button { width: 34px; padding: 0; justify-content: center; }
.iconmenu button[aria-checked="true"] { background: var(--ink); color: var(--on-ink); } .iconmenu button[aria-checked="true"] .ico { color: inherit; }

.tabs { display: flex; gap: 2px; margin: 0 12px; padding: 3px; border-radius: 10px; background: var(--well); flex: none; }
.tabs button { flex: 1; height: 26px; border-radius: 7px; font-weight: 500; font-size: 12.5px; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: var(--contact); }
.body { overflow-y: auto; overscroll-behavior: contain; padding: 12px 14px 14px; min-height: 0; scrollbar-width: thin; }
.rows { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.rows > label, .rows > .lbl { color: var(--ink-2); font-size: 12.5px; line-height: 16px; }
.blk { grid-column: 1 / -1; display: grid; gap: 6px; }
.blk > .bh { display: flex; justify-content: space-between; align-items: center; color: var(--ink-2); font-size: 12.5px; min-height: 24px; }
.blk > .bh span { color: var(--ink-3); }
.group { grid-column: 1 / -1; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--hair); font-weight: 600; font-size: 12.5px; }

/* ruled field: a well with one ruled line under it, like an entry on a drawing's title block */
.f { width: 100%; min-width: 0; height: 30px; border: 0; border-radius: 8px; background: var(--well); box-shadow: inset 0 -1px 0 var(--field-edge); padding: 0 10px; font-weight: 500; }
.f::placeholder { color: var(--ink-3); font-weight: 400; }
.f:hover { background: var(--well-2); }
.f:focus { outline: none; background: var(--sheet); box-shadow: inset 0 0 0 1.5px var(--ink); }
textarea.f { height: auto; min-height: 66px; padding: 6px 10px; resize: vertical; line-height: 18px; font-weight: 400; display: block; }
textarea.f.code { font: 400 11.5px/17px var(--mono); min-height: 84px; }
.sel { position: relative; display: block; min-width: 0; }
.sel select { appearance: none; -webkit-appearance: none; padding-right: 26px; cursor: pointer; text-overflow: ellipsis; }
.sel::after { content: ""; position: absolute; right: 11px; top: 11px; width: 6px; height: 6px; border: solid var(--ink-3); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
.sel.dot select { padding-left: 26px; }
.sel.dot::before { content: ""; position: absolute; left: 11px; top: 11.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--dotc, var(--hair-2)); z-index: 1; pointer-events: none; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; height: 30px; border-radius: 8px; background: var(--well); box-shadow: inset 0 -1px 0 var(--field-edge); }
.step button { display: grid; place-items: center; color: var(--ink-2); border-radius: 8px; }
.step button:hover { background: var(--well-2); color: var(--ink); }
.step input { border: 0; background: none; text-align: center; font-weight: 500; font-variant-numeric: tabular-nums; min-width: 0; -moz-appearance: textfield; appearance: textfield; }
.step input::-webkit-inner-spin-button { -webkit-appearance: none; }
.step input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--ink); border-radius: 6px; background: var(--sheet); }
.unit { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; } .unit span { color: var(--ink-3); font-size: 12px; }
.sw { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--field-edge); position: relative; cursor: pointer; justify-self: start; transition: background .12s; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--sheet); box-shadow: var(--contact); transition: translate .2s var(--spring); }
.sw:checked { background: var(--ink); } .sw:checked::after { translate: 14px 0; background: var(--on-ink); }
.swrow { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; min-height: 30px; }
.swrow label { color: var(--ink-2); font-size: 12.5px; }
.dots { display: flex; gap: 7px; height: 30px; align-items: center; }
.dots button { width: 18px; height: 18px; border-radius: 50%; background: var(--c); }
.dots button[aria-checked="true"] { box-shadow: 0 0 0 2px var(--sheet), 0 0 0 3.5px var(--ink); }
.shapes { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; padding: 3px; border-radius: 10px; background: var(--well); }
.shapes button { height: 30px; border-radius: 7px; display: grid; place-items: center; }
.shapes svg { width: 22px; height: 14px; overflow: visible; }
.shapes svg * { fill: none; stroke: var(--ink-3); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.shapes button:hover svg * { stroke: var(--ink); }
.shapes button[aria-checked="true"] { background: var(--sheet); box-shadow: var(--contact); }
.shapes button[aria-checked="true"] svg * { stroke: var(--t); fill: color-mix(in oklab, var(--t) 13%, var(--sheet)); }
.seg { display: flex; gap: 2px; padding: 3px; height: 30px; border-radius: 8px; background: var(--well); }
.seg button { flex: 1; border-radius: 6px; font-weight: 500; font-size: 12.5px; color: var(--ink-2); }
.seg button[aria-checked="true"] { background: var(--sheet); color: var(--ink); box-shadow: var(--contact); }
.pick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.pick .f { display: flex; align-items: center; gap: 8px; text-align: left; position: relative; padding-right: 26px; }
.pick .f::after { content: ""; position: absolute; right: 11px; top: 11px; width: 6px; height: 6px; border: solid var(--ink-3); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
.quiet { height: 30px; padding: 0 10px; border-radius: 8px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.quiet:hover { background: var(--well); color: var(--ink); }
.metric { display: grid; grid-template-columns: minmax(0, 1fr) 76px 26px; gap: 6px; align-items: center; }
.metric .f:nth-child(2) { font-family: var(--mono); font-size: 12px; text-align: right; }
.link { display: grid; grid-template-columns: minmax(0, 1fr) auto 26px; gap: 8px; align-items: center; height: 30px; padding-left: 10px; border-radius: 8px; background: var(--well); }
.link a { color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-color: var(--hair-2); text-underline-offset: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link span { color: var(--ink-3); font-size: 12px; }
details.disc { grid-column: 1 / -1; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--hair); }
details.disc summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 28px; font-weight: 600; font-size: 12.5px; border-radius: 6px; }
details.disc summary::-webkit-details-marker { display: none; }
details.disc summary::before { content: ""; width: 5px; height: 5px; border: solid var(--ink-3); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .12s; margin-left: 2px; }
details.disc[open] summary::before { transform: rotate(45deg); }
details.disc textarea { margin-top: 4px; }
.reverse { grid-column: 1 / -1; justify-self: start; margin-left: -10px; }

@supports (appearance: base-select) {
  .sel select, .sel select::picker(select) { appearance: base-select; }
  .sel select { display: flex; align-items: center; }
  .sel select::picker-icon { display: none; }
  .sel select::picker(select) { margin-top: 4px; padding: 4px; border: 1px solid var(--hair); border-radius: 12px; background: var(--sheet); box-shadow: var(--lift); color: var(--ink); font: 400 13px/20px var(--sans); }
  .sel select option { min-height: 30px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
  .sel select option:hover, .sel select option:focus-visible { background: var(--well); outline: none; }
  .sel select option:checked { font-weight: 600; background: none; }
  .sel select option:checked:hover { background: var(--well); }
  .sel select option::checkmark { order: 1; margin-left: auto; color: var(--ink-2); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (prefers-reduced-transparency: reduce) { .island, .insp { background: var(--sheet); backdrop-filter: none; } }
@media (max-width: 760px) {
  .stage { left: 50%; top: 24%; transform: translate(-50%, -50%) scale(.56); }
  .insp { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 60%; border-radius: 20px; }
  .insp.enter { animation-name: rise; }
  .se, .hint, .nw span { display: none; }
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
</style>

function refresh() { drawStage(); renderCard(); $('#hint').textContent = pinned && sel.type === 'none' ? 'Kept open: with nothing selected the card shows the document.' : 'Click a component or a wire. Click the sheet to put the card away.'; }
stage.addEventListener('click', (e) => {
  const n = e.target.closest('.node'), w = e.target.closest('g[data-id]');
  if (!n && !w) return;
  e.stopPropagation(); menu = null; closed = false;
  sel = n ? { type: 'node', id: n.dataset.id } : { type: 'wire', id: w.dataset.id };
  refresh();
  if (n) stage.querySelector(`[data-id="${sel.id}"]`)?.focus();
});
document.addEventListener('click', (e) => {
  if (menu && !e.target.closest('.menu')) { menu = null; refresh(); return; }
  if (e.target.id === 'sheet' || e.target.id === 'stage' || e.target.id === 'wires') { sel = { type: 'none' }; menu = null; refresh(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (menu) menu = null; else if (!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) sel = { type: 'none' }; else e.target.blur(); refresh(); } });
$('#theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
const q = new URLSearchParams(location.search);
if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
if (q.get('tab')) tab = q.get('tab');
if (q.get('sel')) sel = q.get('sel') === 'none' ? { type: 'none' } : { type: q.get('sel').startsWith('w') ? 'wire' : 'node', id: q.get('sel') };
refresh();
</script>
</body>
</html>
