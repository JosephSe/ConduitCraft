<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2098" height="1170" viewBox="0 0 2098 1170" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Marquee: Flash-Sale Ticketing</title>
  <desc id="diagram-desc">Marquee: Flash-Sale Ticketing. Marquee (a made-up company) sells 60,000 stadium seats to 1.8 million fans who all arrive at 10:00. A virtual waiting room at the edge admits fans at a rate the origin can handle. Seat Inventory holds seats for 8 minutes while the fan pays, the Payment Orchestrator fails over between two card processors, and a transactional outbox streams every order to Kafka, where ticketing and the promoter's live dashboard read it at their own pace. It has 9 components in 3 swimlanes, joined by 9 wires.

Swimlanes
- Global (DNS and traffic steering): Fans and Global Traffic Manager.
- eu-west (active) (Serves every fan today): eu-west stack, Ticket DB (eu), Nightly Snapshots and Backup Job.
- us-east (warm standby) (Takes over in under 5 min): us-east stack, Ticket DB (us) and Backup Vault.

Frames
- Frame Disaster recovery: RPO 1 s, RTO 5 min holds nothing.

Main flows
- Fans calls Global Traffic Manager for “DNS lookup” (about 20 ms).
- Global Traffic Manager calls eu-west stack over HTTP for “100% today” (about 30 ms) and us-east stack over HTTP for “0%, until failover” (about 90 ms).
- eu-west stack calls Ticket DB (eu) over SQL for “Read / write”.
- us-east stack calls Ticket DB (us) over SQL for “Read (standby)”.
- Ticket DB (eu) sends messages to Ticket DB (us) over SQL for “Async replication”.
- Nightly Snapshots calls Backup Job for “Start job”.
- Backup Job calls Backup Vault for “Upload + read back” and Ticket DB (eu) over SQL for “Read snapshot”.

Load balancers
- Global Traffic Manager is a load balancer for Fans. It spreads traffic over eu-west stack and us-east stack, weighted.

Caches, limiters and schedulers
- Nightly Snapshots is a scheduler (0 3 * * *) that starts Backup Job.

Scenarios
- On-Sale Rush (Waiting Room), 6 steps: 10:00:00; EDGE; NO TOKEN; ADMITTED; SEAT MAP; MISS.
- Buy Two Tickets (Hold → Pay → Confirm), 15 steps: 10:04 · BUY; TOKEN OK; SKIP THE LINE; GATEWAY; SIGNED IN · HUMAN; SEAT MAP; LOAD SECTION; HOLD 2 SEATS; LOCKED · 8 MIN; GREY ON EVERY MAP; CHECKOUT; AUTHORISED $184; SOLD; ORDER + OUTBOX; CONFIRMED.
- Tickets Delivered (Async), 9 steps: CDC; LIVE SALES; ISSUE JOB; ONE ISSUER; PDF + PASS; ISSUED; IN YOUR WALLET; SMS (LEGACY); DOWNLOAD.
- Card Processor A Outage, 5 steps: CHECKOUT; AUTHORISE; TIMEOUT · BREAKER OPENS; PROCESSOR B; SOLD ANYWAY.
- Hold Expires: Seats Back On Sale, 3 steps: EVERY 30 S; RELEASE 312 HOLDS; BACK ON THE MAP.
- Ticket Database Fails, 4 steps: HOLD; NO PRIMARY; MAP STILL SHOWS; TICKETS STALL.

Colours
- Blue means Fan requests: what the fan is waiting on.
- Green means Seats &amp; orders: state that must be right.
- Violet means Trust &amp; money: identity, fraud, payments.
- Amber means Async &amp; live: events, queues, sockets.
- Red means Fallbacks: failure paths and legacy.</desc>
