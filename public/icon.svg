<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131c"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#252b3d" stroke-width="6"/>

  <!-- Subtle ambient glow -->
  <circle cx="256" cy="256" r="210" fill="url(#halo)"/>

  <!-- Blueprint Grid Pattern Subtlety -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="2">
    <line x1="96" y1="96" x2="416" y2="96"/>
    <line x1="96" y1="176" x2="416" y2="176"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="336" x2="416" y2="336"/>
    <line x1="96" y1="416" x2="416" y2="416"/>
    <line x1="96" y1="96" x2="96" y2="416"/>
    <line x1="176" y1="96" x2="176" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="336" y1="96" x2="336" y2="416"/>
    <line x1="416" y1="96" x2="416" y2="416"/>
  </g>

  <!-- Conduit Wires -->
  <!-- Wire 1: Node A to Node B -->
  <path d="M192 168 L260 168 Q288 168 288 196 L288 232" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <path d="M192 168 L260 168 Q288 168 288 196 L288 232" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#glow-blur)"/>

  <!-- Wire 2: Node B to Node C -->
  <path d="M336 320 L336 348 Q336 376 364 376 L384 376" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <path d="M336 320 L336 348 Q336 376 364 376 L384 376" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" filter="url(#glow-blur)"/>

  <!-- Wire 3: Node A to Node C bypass -->
  <path d="M144 212 L144 348 Q144 376 172 376 L288 376" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <path d="M144 212 L144 348 Q144 376 172 376 L288 376" fill="none" stroke="#818cf8" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>

  <!-- Telemetry Pulses on Wires -->
  <circle cx="270" cy="168" r="6" fill="#ffffff" filter="url(#glow-blur)"/>
  <circle cx="270" cy="168" r="3.5" fill="#38bdf8"/>
  <circle cx="336" cy="340" r="5" fill="#34d399" filter="url(#glow-blur)"/>

  <!-- Architecture Component Node 1 (Client / Ingress) -->
  <rect x="96" y="124" width="96" height="88" rx="20" fill="#131722" stroke="url(#cyan-glow)" stroke-width="4"/>
  <rect x="110" y="142" width="28" height="28" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M120 156 h8 M124 152 v8" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="146" y="146" width="34" height="6" rx="3" fill="#94a3b8"/>
  <rect x="146" y="158" width="22" height="5" rx="2.5" fill="#64748b"/>
  <!-- Status dot -->
  <circle cx="176" cy="192" r="5" fill="#38bdf8" filter="url(#glow-blur)"/>

  <!-- Architecture Component Node 2 (Core Processing Engine) -->
  <rect x="240" y="232" width="128" height="104" rx="22" fill="#131722" stroke="url(#violet-glow)" stroke-width="5"/>
  <rect x="258" y="254" width="36" height="36" rx="10" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-width="3"/>
  <rect x="270" y="266" width="12" height="12" rx="3" fill="#c084fc"/>
  <rect x="304" y="258" width="48" height="8" rx="4" fill="#f8fafc"/>
  <rect x="304" y="272" width="32" height="6" rx="3" fill="#a78bfa"/>
  <rect x="258" y="306" width="92" height="14" rx="5" fill="#1e2030"/>
  <circle cx="338" cy="313" r="4" fill="#34d399"/>

  <!-- Architecture Component Node 3 (State / Data Ledger) -->
  <rect x="288" y="356" width="128" height="76" rx="18" fill="#131722" stroke="url(#emerald-glow)" stroke-width="4"/>
  <circle cx="316" cy="394" r="16" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="2.5"/>
  <path d="M310 394 h12 M316 388 v12" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="340" y="386" width="56" height="7" rx="3.5" fill="#e2e8f0"/>
  <rect x="340" y="399" width="36" height="5" rx="2.5" fill="#64748b"/>

</svg>