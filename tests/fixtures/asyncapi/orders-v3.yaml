asyncapi: 3.0.0
info:
  title: Shipping Service
  version: 2.0.0
servers:
  prod:
    host: rabbit.example.com
    protocol: amqp
channels:
  orderPaid:
    address: orders.paid
    messages:
      OrderPaid:
        payload: {type: object}
  parcelShipped:
    address: parcels.shipped
    messages:
      ParcelShipped:
        payload: {type: object}
operations:
  onOrderPaid:
    action: receive
    channel:
      $ref: '#/channels/orderPaid'
  announceShipment:
    action: send
    channel:
      $ref: '#/channels/parcelShipped'
